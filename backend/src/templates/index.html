<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Sensor Data</h1>
        <div class="datetime">
            <p id="datetime"></p>
        </div>
        <div class="card">
            <div class="icon" id="tempIcon">
                <i></i>
            </div>
            <div class="data">
                <h2>Temperature</h2>
                <p id="temp">Loading...</p>
            </div>
        </div>
        <div class="card">
            <div class="icon" id="pressureIcon">
                <i></i>
            </div>
            <div class="data">
                <h2>Pressure</h2>
                <p id="pressure">Loading...</p>
            </div>
        </div>
        <div class="card">
            <div class="icon" id="humidityIcon">
                <i></i>
            </div>
            <div class="data">
                <h2>Humidity</h2>
                <p id="humidity">Loading...</p>
            </div>
        </div>
        <div style="width:400px; height: auto; margin:50px; display: flex; flex-direction: row; justify-content: space-evenly;">
            <canvas id="myChart1" width="400px" height="200px"></canvas>
            <canvas id="myChart2" width="400px" height="200px"></canvas>
        </div>
        <div class="message-form">
            <h2>Send Message to Sensor</h2>
            <form id="messageForm">
                <input type="text" id="messageInput" placeholder="Enter your message" required>
                <div style="flex-direction: row;">
                <button type="submit" >Send</button>
                <button type="button" id="clearButton">Clear</button>
            </div>
            </form>
            <p id="messageStatus"></p>
        </div>
       
    </div><br>
    
    <script>
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            };
            const dateTimeString = now.toLocaleDateString('en-US', options);
            document.getElementById('datetime').textContent = dateTimeString;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
        
        function fetchData() {
            
            fetch('/pico-data')
                .then(response => response.json())
                .then(data => {
                   
                    
                    if (data.status === 'success') {
                        const tempElement = document.getElementById('temp');
                        const tempIcon = document.getElementById('tempIcon').firstElementChild;
                        const temperature = 10;


                        tempElement.textContent = temperature + ' °C';

                        if (temperature < 15) {
                            tempIcon.className = 'fas fa-thermometer-empty blue';
                        } else if (temperature > 25) {
                            tempIcon.className = 'fas fa-thermometer-full red';
                        } else {
                            tempIcon.className = 'fas fa-thermometer-half green';
                        }

                        const humidityElement = document.getElementById('humidity');
                        const humidityIcon = document.getElementById('humidityIcon').firstElementChild;
                        const humidity = 32;

                        humidityElement.textContent = humidity + ' %';

                        if (humidity < 50) {
                            humidityIcon.className = 'fas fa-tint-slash red';
                        } else if (humidity > 80) {
                            humidityIcon.className = 'fas fa-tint blue';
                        } else {
                            humidityIcon.className = 'fas fa-tint green';
                        }

                        const pressureElement = document.getElementById('pressure');
                        const pressureIcon = document.getElementById('pressureIcon').firstElementChild;
                        const pressure = 820;

                        pressureElement.textContent = pressure + ' hPa';

                        if (pressure < 1000) {
                            pressureIcon.className = 'fas fa-cloud-rain blue';
                        } else if (pressure > 1030) {
                            pressureIcon.className = 'fas fa-sun yellow';
                        } else {
                            pressureIcon.className = 'fas fa-cloud-sun green';
                        }
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        }
        setInterval(fetchData, 5000);  // Fetch data every 5 seconds
        fetchData();  // Initial fetch

        document.getElementById('messageForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const message = document.getElementById('messageInput').value;

            fetch('/message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('messageStatus').textContent = 'Message sent successfully!';
                    document.getElementById('messageStatus').style.color = 'green';
                } else {
                    document.getElementById('messageStatus').textContent = 'Error sending message.';
                    document.getElementById('messageStatus').style.color = 'red';
                }
            })
            .catch(error => {
                document.getElementById('messageStatus').textContent = 'Error sending message.';
                document.getElementById('messageStatus').style.color = 'red';
                console.error('Error:', error);
            });

            document.getElementById('messageInput').value = '';  // Clear the input field
        });
        document.getElementById('clearButton').addEventListener('click', function() {
    const message = 'NONE';

    fetch('/message', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            document.getElementById('messageStatus').textContent = 'Message cleared successfully!';
            document.getElementById('messageStatus').style.color = 'green';
        } else {
            document.getElementById('messageStatus').textContent = 'Error clearing message.';
            document.getElementById('messageStatus').style.color = 'red';
        }
    })
    .catch(error => {
        document.getElementById('messageStatus').textContent = 'Error clearing message.';
        document.getElementById('messagePartStatus').style.color = 'red';
        console.error('Error:', error);
    });

    document.getElementById('messageInput').value = '';  // Clear the input field after sending the message
});

        const dataTemp = [10, 12, 15, 12, 17, -8, 10, 13, 15];
        const labelsTemp = ['Jour 1', 'Jour 2', 'Jour 3', 'Jour 4', 'Jour 5', 'Jour 6', 'Jour 7', 'Jour 8', 'Jour 9'];

        // Configuration du graphique
        const ctx1 = document.getElementById('myChart1').getContext('2d');
        const chart1 = new Chart(ctx1, {
            type: 'line',  // Type de graphique
            data: {
                labels: labelsTemp,
                datasets: [{
                    label: 'Variation de température',
                    data: dataTemp,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 2,
                    fill: true
                }]
            },
            options: {
                scales: {
                    x: {
                        type: 'category'  // Échelle par défaut pour les catégories (étiquettes)
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        const dataHum = [50, 42, 65, 72, 67, 88, 70, 53, 65];
        const labelsHum = ['Jour 1', 'Jour 2', 'Jour 3', 'Jour 4', 'Jour 5', 'Jour 6', 'Jour 7', 'Jour 8', 'Jour 9'];

        // Configuration du graphique
        const ctx2 = document.getElementById('myChart2').getContext('2d');
        const chart2 = new Chart(ctx2, {
            type: 'line',  // Type de graphique
            data: {
                labels: labelsHum,
                datasets: [{
                    label: 'Variation de l\'humidité',
                    data: dataHum,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 2,
                    fill: true
                }]
            },
            options: {
                scales: {
                    x: {
                        type: 'category'  // Échelle par défaut pour les catégories (étiquettes)
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
